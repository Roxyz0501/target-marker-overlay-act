name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare pinned ACT reference
        id: act
        shell: pwsh
        run: |
          $output = @(& .\scripts\prepare-act-reference.ps1)
          if ($output.Count -ne 1) {
            throw "Expected the ACT resolver to output exactly one path."
          }
          $actPath = [string]$output[0]
          if (-not (Test-Path -LiteralPath $actPath)) {
            throw "Resolved ACT path does not exist: $actPath"
          }
          "path=$actPath" >> $env:GITHUB_OUTPUT

      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build .\src\TargetMarkerOverlay\TargetMarkerOverlay.csproj -c Release "-p:ActPath=${{ steps.act.outputs.path }}"

      - name: Run core tests
        shell: pwsh
        run: |
          dotnet run --project .\tests\CoreTests\CoreTests.csproj -c Release "-p:ActPath=${{ steps.act.outputs.path }}"

      - name: Package release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\scripts\package-release.ps1 -Version $version

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME `
            ".\release\TargetMarkerOverlay-v$version.zip" `
            ".\release\SHA256SUMS.txt" `
            --verify-tag --generate-notes --title "Target Marker Overlay v$version"
